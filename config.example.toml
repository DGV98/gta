# gta-shorts settings. Copy to config.toml and adjust. Secrets go in .env.

[twitch]
game_name = "Grand Theft Auto VI"
# game_id = ""            # set this if the category name lookup ever fails
language = "en"           # stream language filter for `discover` ("" = any)

[selection]
stretches_per_vod = 2     # how many hot stretches of each VOD to clip
stretch_minutes = 12      # length of each stretch
lead_seconds = 60         # start this long before the first viewer clip (setup)
min_viewer_clips = 2      # a stretch with fewer viewer clips is not worth a job

[openshorts]
api_url = "http://localhost:8000"
layouts = ["auto"]        # Gemini picks per video: facecam stacked under gameplay for streams
auto_hook = true          # burn the hook text over the first seconds
captions = true
# clip_min_seconds = 15   # openshorts default band is 15-60 s
# clip_max_seconds = 60
# target_clips = 4        # per stretch; default scales with length
poll_seconds = 10
timeout_minutes = 90

[download]
max_height = 1080

[output]
dir = "runs"
credit = "🎥 twitch.tv/{login}"   # appended to every caption; {login} and {name} available
keep_sources = false              # delete each downloaded stretch once clipped

[watch]
# Channels from your clipping programs (Twitch logins). Always tracked, whatever
# they are playing, and clipped before anyone else.
priority = []
discover_top = 20             # look at this many top live GTA VI streams each scan
min_viewers = 2000            # ...and track the ones with at least this many viewers
track_days = 5                # forget a discovered channel not seen in GTA VI for this long
poll_minutes = 30             # scan interval
settle_minutes = 30           # after a stream ends, wait this long for viewers' clips
max_vod_age_hours = 48        # don't clip streams that ended longer ago than this
max_stretches_per_day = 12    # openshorts jobs per rolling 24 h (GPU time + Gemini)
max_usd_per_day = 1.0         # Gemini spend per rolling 24 h, as openshorts reports it (0 = no cap)
max_attempts = 3              # per stretch, then it is marked failed
max_muted_fraction = 0.25     # skip stretches where Twitch muted more than this (DMCA music)
min_free_gb = 20              # pause when the disk under output.dir gets this full
keep_clip_days = 14           # delete finished clip files after this (manifests stay)
# state_db = "state.db"       # relative to output.dir
