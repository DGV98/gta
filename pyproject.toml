[project]
name = "gta-shorts"
version = "0.1.0"
description = "Find hot GTA VI moments in Twitch VODs and clip them with self-hosted openshorts"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    "yt-dlp",
]

[project.scripts]
gta-shorts = "gta_shorts.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gta_shorts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
